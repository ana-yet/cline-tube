services:
  - type: web
    name: cinetube-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate --schema=../prisma/schema.prisma && npm run build
    preDeployCommand: npx prisma migrate deploy --schema=../prisma/schema.prisma
    startCommand: node dist/server.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: http
      - key: EMAIL_DELIVERY_ENDPOINT
        sync: false
      - key: EMAIL_DELIVERY_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MEDIA_VIEW_HMAC_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
